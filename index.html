<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ソースコード表示ツール</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #f8f9fa;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="url"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            max-height: 500px;
            font-family: Consolas, Monaco, monospace;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h2>WEBページソースコード取得</h2>
    <p>URLを入力して「取得」を押すと、そのページのHTMLソースコードを表示します。</p>

    <div class="input-group">
        <input type="url" id="urlInput" placeholder="https://example.com" value="https://example.com">
        <button onclick="fetchSource()">取得</button>
    </div>

    <h3>取得結果:</h3>
    <pre><code id="result">URLを入力して「取得」ボタンを押してください</code></pre>

    <script>
        async function fetchSource() {
            const targetUrl = document.getElementById('urlInput').value.trim();
            const resultElement = document.getElementById('result');

            if (!targetUrl) {
                alert('URLを入力してください');
                return;
            }

            resultElement.textContent = "取得中...";

            // CORSの制限を回避するため、無料のCORSプロキシサービス（allorigins）を使用
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) {
                    throw new Error('通信エラーが発生しました');
                }
                
                const data = await response.json();
                
                if (data.contents) {
                    // textContent を使うことで自動的に安全にエスケープ表示されます
                    resultElement.textContent = data.contents;
                } else {
                    resultElement.textContent = "ソースコードを取得できませんでした。";
                }
            } catch (err) {
                resultElement.textContent = "エラー: " + err.message + "\n（URLが正しいか、またはアクセスが制限されていないか確認してください）";
            }
        }
    </script>

</body>
</html>
