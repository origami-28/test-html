<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ソースコード表示ツール (ハイライト対応)</title>
    
    <!-- Prism.js の VS Code風ダークテーマ (Okaidia) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css">
    <!-- Prism.js 行番号表示プラグインのCSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #1e1e1e;
            color: #ffffff;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="url"] {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            background-color: #252526;
            color: #ffffff;
        }
        input[type="url"]:focus {
            outline: 1px solid #007acc;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #1177bb;
        }
        .code-container {
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            overflow: hidden;
            background-color: #272822;
        }
        /* Prism.js の表示枠調整 */
        pre[class*="language-"] {
            margin: 0;
            max-height: 600px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>WEBページソースコード取得 & ハイライター</h2>
    <p>URLを入力して「取得」を押すと、HTML/CSS/JSを自動判別してシンタックスハイライト表示します。</p>

    <div class="input-group">
        <input type="url" id="urlInput" placeholder="https://example.com" value="https://example.com">
        <button onclick="fetchSource()">取得</button>
    </div>

    <h3>取得結果:</h3>
    <div class="code-container">
        <!-- class="line-numbers" で行番号を表示、class="language-markup" でHTML指定 -->
        <pre class="line-numbers"><code id="result" class="language-markup">URLを入力して「取得」ボタンを押してください</code></pre>
    </div>

    <!-- Prism.js コアライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.css"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <!-- 行番号表示プラグインのJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

    <script>
        async function fetchSource() {
            const targetUrl = document.getElementById('urlInput').value.trim();
            const resultElement = document.getElementById('result');

            if (!targetUrl) {
                alert('URLを入力してください');
                return;
            }

            resultElement.textContent = "取得中...";
            // 一度既存のハイライト装飾を破棄
            Prism.highlightElement(resultElement);

            // CORSの制限を回避するため、無料のCORSプロキシサービス（allorigins）を使用
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) {
                    throw new Error('通信エラーが発生しました');
                }
                
                const data = await response.json();
                
                if (data.contents) {
                    // 1. テキストをセット (HTML文字は自動エスケープ)
                    resultElement.textContent = data.contents;
                    
                    // 2. Prism.js を再実行してハイライトと行番号を反映
                    Prism.highlightElement(resultElement);
                } else {
                    resultElement.textContent = "ソースコードを取得できませんでした。";
                }
            } catch (err) {
                resultElement.textContent = "エラー: " + err.message + "\n（URLが正しいか確認してください）";
            }
        }
    </script>

</body>
</html>
