<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>文字コードチェッカー</title>
    <style>
        /* ライトモードの色 */
        body {
            background-color: #f0f2f5;
            color: #333;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            width: 350px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
        }

        /* ヘルパー（タイトルとアイコン） */
        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #e9ecef;
            border-bottom: 1px solid #ccc;
            font-size: 14px;
            font-weight: bold;
        }

        /* アイコンボタン */
        .btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 5px;
        }

        /* コード表示エリア */
        .box-body {
            padding: 12px;
            margin: 0;
            font-family: monospace;
            font-size: 14px;
            background: #fff;
            color: #333;
            white-space: pre-wrap;
        }

        /* ダークモード（bodyに darkクラスがついたとき） */
        body.dark {
            background-color: #121212;
            color: #f0f0f0;
        }
        body.dark .box {
            background: #1e1e1e;
            border-color: #444;
        }
        body.dark .box-header {
            background: #2d2d2d;
            border-color: #444;
            color: #f0f0f0;
        }
        body.dark .box-body {
            background: #1e1e1e;
            color: #f0f0f0;
        }
        body.dark .btn {
            color: #f0f0f0;
        }
    </style>
</head>
<body>

    <div class="box">
        <!-- 1. コードタイトル ＆ アイコンたち -->
        <div class="box-header">
            <span id="code-title">文字コード: UTF-8</span>
            <div>
                <!-- 2. ダークモード切り替えアイコン -->
                <button class="btn" id="theme-btn" title="ダークモード切り替え">🌙</button>
                <!-- 3. コピー用アイコン -->
                <button class="btn" id="copy-btn" title="コピー">📋</button>
            </div>
        </div>
        <!-- コード表示エリア -->
        <pre class="box-body" id="code-text">U+3042 (あ)
U+3044 (い)</pre>
    </div>

    <script>
        // ダークモード切り替え
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            // アイコンの切り替え
            themeBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
        });

        // コピー機能
        const copyBtn = document.getElementById('copy-btn');
        const codeText = document.getElementById('code-text');
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(codeText.textContent).then(() => {
                alert('コピーしたよ！'); // シンプルにアラートでお知らせ
            });
        });
    </script>

</body>
</html>
