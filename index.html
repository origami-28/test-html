<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ソースコード表示ツール (ハイライト対応)</title>
    
    <!-- Prism.js の VS Code風ダークテーマ (Okaidia) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css">
    <!-- Prism.js 行番号表示プラグインのCSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #1e1e1e;
            color: #ffffff;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="url"] {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            background-color: #252526;
            color: #ffffff;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1177bb; }

        /* コピーボタン専用スタイル */
        button.copy-btn {
            background-color: #388e3c;
        }
        button.copy-btn:hover {
            background-color: #2e7d32;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .result-header h3 {
            margin: 0;
        }

        .code-container {
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            overflow: hidden;
            background-color: #272822;
        }
        pre[class*="language-"] {
            margin: 0;
            max-height: 600px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>WEBページソースコード取得 & ハイライター</h2>
    <div class="input-group">
    <input type="url" id="urlInput" placeholder="https://example.com">
    <button onclick="fetchSource()">取得</button>
</div>

    <div class="result-header">
        <h3>取得結果:</h3>
        <button id="copyBtn" class="copy-btn" onclick="copyCode()">コピー</button>
    </div>

    <div class="code-container">
        <pre class="line-numbers"><code id="result" class="language-markup">URLを入力して「取得」ボタンを押してください</code></pre>
    </div>

    <!-- Prism.js 読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

    <script>
        async function fetchSource() {
            const targetUrl = document.getElementById('urlInput').value.trim();
            const resultElement = document.getElementById('result');

            if (!targetUrl) {
                alert('URLを入力してください');
                return;
            }

            resultElement.textContent = "取得中...";
            Prism.highlightElement(resultElement);

            // 高速・高安定な CORS プロキシに変更
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) {
                    throw new Error(`HTTPエラー (ステータス: ${response.status})`);
                }
                
                // テキスト形式でHTMLをそのまま取得
                const htmlText = await response.text();
                
                resultElement.textContent = htmlText;
                Prism.highlightElement(resultElement);

            } catch (err) {
                resultElement.textContent = "エラーが発生しました:\n" + err.message + 
                    "\n\n【考えられる原因】\n" +
                    "・入力したURLが正しいか確認してください（https:// から入力）\n" +
                    "・ブラウザのデベロッパーツール(F12)のConsoleに詳細エラーが出ている可能性があります";
            }
        }

        // --- 今回追加したコピー処理 ---
        async function copyCode() {
            const resultElement = document.getElementById('result');
            const copyBtn = document.getElementById('copyBtn');
            const codeText = resultElement.textContent;

            // 初期表示や取得中の状態ではコピーをガード
            if (!codeText || codeText === "URLを入力して「取得」ボタンを押してください" || codeText === "取得中...") {
                alert('コピーするソースコードがありません');
                return;
            }

            try {
                // クリップボードへコピーを実行
                await navigator.clipboard.writeText(codeText);

                // ボタンのテキストを一時的に変更（ユーザーへの通知）
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'コピー完了！';
                copyBtn.disabled = true;

                // 2秒後に元の表記に戻す
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.disabled = false;
                }, 2000);

            } catch (err) {
                alert('コピーに失敗しました: ' + err.message);
            }
        }
    </script>

</body>
</html>
